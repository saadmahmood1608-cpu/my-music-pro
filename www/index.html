<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>My Music Pro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="top-row">
      <div>
        <h1>My Music Pro</h1>
        <div id="storageStats" class="stats-pill">0 tracks • 0 MB</div>
      </div>
      <label class="add-btn" for="fileInput">+ Add Music</label>
      <input type="file" id="fileInput" multiple />
    </div>

    <div class="search-row">
      <input type="search" id="searchInput" placeholder="Search 1,000+ songs..." autocomplete="off" />
      <select id="sortSelect" aria-label="Sort songs">
        <option value="recent">Recent</option>
        <option value="az">A – Z</option>
        <option value="za">Z – A</option>
        <option value="fav">Favorites</option>
      </select>
    </div>

    <div id="statusBar" class="status-bar hidden"></div>
  </header>

  <main id="scrollViewport" class="scroll-viewport">
    <div id="virtualSpacer" class="virtual-spacer">
      <div id="virtualContent" class="virtual-content"></div>
    </div>
    <div id="emptyState" class="empty-state hidden">
      No songs found.<br />Tap <b>+ Add Music</b> to import from your iPhone Files.
    </div>
  </main>

  <section class="player">
    <div id="nowPlaying" class="now-playing">Select a song to play</div>

    <div class="progress-row">
      <span id="currentTime">0:00</span>
      <input type="range" id="seekBar" value="0" min="0" step="1" />
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button type="button" class="ctrl-btn" id="shuffleBtn" aria-label="Shuffle">🔀</button>
      <button type="button" class="ctrl-btn" id="prevBtn" aria-label="Previous">⏮</button>
      <button type="button" class="ctrl-btn play-btn" id="playPauseBtn" aria-label="Play or Pause">▶</button>
      <button type="button" class="ctrl-btn" id="nextBtn" aria-label="Next">⏭</button>
      <button type="button" class="ctrl-btn" id="repeatBtn" aria-label="Repeat">🔁</button>
    </div>

    <div class="pro-tools">
      <select id="eqSelect" aria-label="Equalizer">
        <option value="flat">EQ: Flat</option>
        <option value="bass">EQ: Bass Boost</option>
        <option value="vocal">EQ: Vocal</option>
        <option value="treble">EQ: Treble</option>
      </select>
      <select id="speedSelect" aria-label="Speed">
        <option value="1">1.0x</option>
        <option value="0.75">0.75x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
      </select>
      <select id="sleepSelect" aria-label="Sleep Timer">
        <option value="0">Sleep: Off</option>
        <option value="15">15 min</option>
        <option value="30">30 min</option>
        <option value="60">60 min</option>
      </select>
    </div>
  </section>

  <audio id="audio" playsinline preload="metadata"></audio>
  <script src="app.js"></script>
</body>
</html>
